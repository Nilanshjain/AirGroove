<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Test</title>
    <link rel="stylesheet" href="web/css/gestures.css">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-area {
            width: 100%;
            height: 500px;
            background: #333;
            border: 2px solid #555;
            position: relative;
            margin: 20px 0;
        }
        .instructions {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #444;
            color: white;
            border: 1px solid #666;
            cursor: pointer;
        }
        button:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <h1>Cursor Test</h1>

    <div class="instructions">
        <p>This is a test to verify the cursor styling works correctly.</p>
        <p>Click the buttons below to test different cursor states:</p>
    </div>

    <div>
        <button onclick="showCursor('open_palm')">Show Open Palm</button>
        <button onclick="showCursor('closed_fist')">Show Closed Fist</button>
        <button onclick="showCursor('pinch')">Show Pinch</button>
        <button onclick="showCursor('pointer')">Show Pointer</button>
        <button onclick="showCursor('two_fingers')">Show Two Fingers</button>
        <button onclick="hideCursor()">Hide Cursor</button>
    </div>

    <div class="test-area">
        <p style="padding: 20px;">Move your mouse around this area to see if the cursor appears.</p>
    </div>

    <!-- Gesture Pointer -->
    <div class="gesture-pointer" id="gesture-pointer">
        <div class="pointer-inner"></div>
        <div class="pointer-trail"></div>
    </div>

    <script>
        const pointer = document.getElementById('gesture-pointer');

        function showCursor(gesture) {
            console.log('Showing cursor with gesture:', gesture);
            pointer.className = `gesture-pointer active ${gesture}`;
            pointer.style.left = '50%';
            pointer.style.top = '50%';
            console.log('Cursor element:', pointer);
            console.log('Cursor styles:', window.getComputedStyle(pointer));
        }

        function hideCursor() {
            console.log('Hiding cursor');
            pointer.classList.remove('active');
        }

        // Move cursor with mouse for testing
        document.addEventListener('mousemove', (e) => {
            if (pointer.classList.contains('active')) {
                pointer.style.left = e.clientX + 'px';
                pointer.style.top = e.clientY + 'px';
            }
        });

        console.log('Cursor test loaded, pointer element:', pointer);
    </script>
</body>
</html>
