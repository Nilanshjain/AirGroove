<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Test - AirGroove</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
        }

        .test-info {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .gesture-pointer {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: all 0.08s ease;
            opacity: 1;
        }

        .gesture-pointer::before {
            content: '◯';
            display: block;
            font-size: 3rem;
            color: rgba(124, 58, 237, 0.8);
            filter: drop-shadow(0 0 12px rgba(124, 58, 237, 0.6));
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid rgba(0, 255, 136, 0.5);
            border-radius: 8px;
        }

        #debug {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #888;
        }

        button {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.5);
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background: rgba(124, 58, 237, 0.3);
        }
    </style>
</head>
<body>
    <div class="test-info">
        <h1>AirGroove Cursor Test</h1>
        <p>This page tests the cursor connection to the WebSocket backend.</p>
        <button onclick="testMouseCursor()">Test with Mouse</button>
        <button onclick="connectWebSocket()">Connect WebSocket</button>
        <button onclick="location.href='index.html'">Go to Main App</button>
    </div>

    <div id="status">
        <strong>Status:</strong> <span id="status-text">Ready</span>
    </div>

    <div id="debug"></div>

    <!-- Gesture Pointer -->
    <div class="gesture-pointer" id="gesture-pointer"></div>

    <script>
        const statusText = document.getElementById('status-text');
        const debugDiv = document.getElementById('debug');
        const cursor = document.getElementById('gesture-pointer');

        let ws = null;

        function log(message) {
            console.log(message);
            debugDiv.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
        }

        function testMouseCursor() {
            log('Testing cursor with mouse movement...');
            statusText.textContent = 'Mouse test mode';
            statusText.style.color = '#00ff88';

            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
                cursor.style.opacity = '1';
            });
        }

        function connectWebSocket() {
            log('Connecting to WebSocket server at ws://localhost:8765...');
            statusText.textContent = 'Connecting...';
            statusText.style.color = '#ffaa00';

            try {
                ws = new WebSocket('ws://localhost:8765');

                ws.onopen = () => {
                    log('✓ WebSocket connected!');
                    statusText.textContent = 'Connected - Waiting for hand data';
                    statusText.style.color = '#00ff88';
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        // Debug: Log full message structure once
                        if (!window.structureLogged) {
                            log(`Message structure: ${JSON.stringify(data, null, 2)}`);
                            window.structureLogged = true;
                        }

                        if (data.type === 'gesture_update') {
                            const payload = data.payload;
                            const leftHand = payload.left_hand;
                            const rightHand = payload.right_hand;

                            // Use right hand if available, otherwise left
                            let position = null;
                            let gesture = 'none';

                            if (rightHand && rightHand.detected && rightHand.position) {
                                position = rightHand.position;
                                gesture = rightHand.gesture || 'unknown';

                                // Check if position has x and y
                                if (typeof position.x !== 'undefined' && typeof position.y !== 'undefined') {
                                    log(`Right hand: ${gesture} at (${position.x.toFixed(2)}, ${position.y.toFixed(2)})`);
                                } else if (Array.isArray(position) && position.length >= 2) {
                                    // Position might be an array [x, y]
                                    position = { x: position[0], y: position[1] };
                                    log(`Right hand: ${gesture} at (${position.x.toFixed(2)}, ${position.y.toFixed(2)})`);
                                } else {
                                    log(`Right hand position format: ${JSON.stringify(position)}`);
                                }
                            } else if (leftHand && leftHand.detected && leftHand.position) {
                                position = leftHand.position;
                                gesture = leftHand.gesture || 'unknown';

                                if (typeof position.x !== 'undefined' && typeof position.y !== 'undefined') {
                                    log(`Left hand: ${gesture} at (${position.x.toFixed(2)}, ${position.y.toFixed(2)})`);
                                } else if (Array.isArray(position) && position.length >= 2) {
                                    position = { x: position[0], y: position[1] };
                                    log(`Left hand: ${gesture} at (${position.x.toFixed(2)}, ${position.y.toFixed(2)})`);
                                } else {
                                    log(`Left hand position format: ${JSON.stringify(position)}`);
                                }
                            }

                            if (position && typeof position.x !== 'undefined' && typeof position.y !== 'undefined') {
                                const x = position.x * window.innerWidth;
                                const y = position.y * window.innerHeight;

                                cursor.style.left = x + 'px';
                                cursor.style.top = y + 'px';
                                cursor.style.opacity = '1';

                                statusText.textContent = `Hand detected: ${gesture}`;
                            }
                        }
                    } catch (err) {
                        log(`Error: ${err.message} - Stack: ${err.stack}`);
                    }
                };

                ws.onerror = (error) => {
                    log(`✗ WebSocket error: ${error}`);
                    statusText.textContent = 'Connection error';
                    statusText.style.color = '#ff4444';
                };

                ws.onclose = () => {
                    log('WebSocket connection closed');
                    statusText.textContent = 'Disconnected';
                    statusText.style.color = '#ff4444';
                };

            } catch (err) {
                log(`✗ Failed to create WebSocket: ${err.message}`);
                statusText.textContent = 'Failed to connect';
                statusText.style.color = '#ff4444';
            }
        }

        log('Test page loaded. Click buttons to test.');
    </script>
</body>
</html>
