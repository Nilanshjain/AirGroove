<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirGroove - User Profile</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dj-layout.css">
    <link rel="stylesheet" href="css/profile.css">
</head>
<body>
    <!-- Professional Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <div class="navbar-logo">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="url(#grad1)" stroke="#7c3aed" stroke-width="2"/>
                    <path d="M15 12v16l12-8z" fill="white"/>
                    <defs>
                        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.8" />
                            <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.9" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="navbar-title">AirGroove</div>
        </div>
        <div class="navbar-menu">
            <a href="index.html" class="navbar-item hoverable">Homepage</a>
            <a href="library.html" class="navbar-item hoverable">Library</a>
            <a href="#how-to-use" class="navbar-item hoverable">How to Use</a>
            <a href="#settings" class="navbar-item hoverable">Settings</a>
        </div>
        <div class="navbar-profile hoverable">
            <div class="profile-avatar">U</div>
            <span class="profile-name">User</span>
        </div>
    </nav>

    <!-- Profile Main Container -->
    <div class="profile-container" style="margin-top: 80px;">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-header-content">
                <div class="profile-avatar-large">
                    <span id="profile-avatar-text">U</span>
                </div>
                <div class="profile-info">
                    <h1 class="profile-username" id="profile-username">User</h1>
                    <p class="profile-subtitle">DJ Profile</p>
                    <button class="edit-profile-btn" id="edit-profile-btn">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </span>
                        <span>Edit Profile</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Profile Content -->
        <div class="profile-content">
            <!-- Genre Preferences Section -->
            <section class="profile-section">
                <div class="section-header">
                    <h2 class="section-title">Music Preferences</h2>
                    <p class="section-subtitle">Select your favorite genres to personalize your experience</p>
                </div>

                <div class="genre-categories" id="genre-categories">
                    <!-- Genre categories will be populated here -->
                </div>

                <div class="selected-genres-summary">
                    <h3>Selected Genres (<span id="selected-count">0</span>)</h3>
                    <div class="selected-genres-list" id="selected-genres-list">
                        <p class="empty-message">No genres selected yet</p>
                    </div>
                    <button class="save-preferences-btn" id="save-preferences-btn">
                        <span>Save Preferences</span>
                    </button>
                </div>
            </section>

            <!-- Statistics Section -->
            <section class="profile-section">
                <div class="section-header">
                    <h2 class="section-title">Your Stats</h2>
                    <p class="section-subtitle">Track your DJ journey</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18V5l12-2v13"/>
                                <circle cx="6" cy="18" r="3"/>
                                <circle cx="18" cy="16" r="3"/>
                            </svg>
                        </div>
                        <div class="stat-value" id="stat-tracks">0</div>
                        <div class="stat-label">Tracks</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                        </div>
                        <div class="stat-value" id="stat-playlists">0</div>
                        <div class="stat-label">Playlists</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </div>
                        <div class="stat-value" id="stat-liked">0</div>
                        <div class="stat-label">Liked Songs</div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </div>
                        <div class="stat-value" id="stat-hours">0h</div>
                        <div class="stat-label">Mix Time</div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal hidden" id="edit-profile-modal">
        <div class="modal-overlay" id="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Profile</h2>
                <button class="modal-close" id="modal-close">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="username-input">Username</label>
                    <input type="text" id="username-input" class="form-input" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="bio-input">Bio (Optional)</label>
                    <textarea id="bio-input" class="form-textarea" placeholder="Tell us about your DJ style..." rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancel-edit-profile">Cancel</button>
                <button class="btn-primary" id="confirm-edit-profile">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/icons.js"></script>
    <script src="js/genres.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
